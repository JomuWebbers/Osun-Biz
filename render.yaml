services:
  - type: web
    name: osunbiz
    env: docker
    plan: free
    dockerfile: Dockerfile
    # Add PostgreSQL service
    services:
      - type: postgresql
        name: osunbiz-db
        plan: free
    # Environment variables for the web service
    envVars:
      # These will be automatically provided by Render's PostgreSQL service
      DATABASE_URL: "${POSTGRESQL_CONNECTION_URL}"
      APP_NAME: OsunBiz
      APP_ENV: production
      APP_DEBUG: false
      # Generate a random APP_KEY
      APP_KEY: "${random}"
      BCRYPT_ROUNDS: 12
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      CACHE_STORE: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: hello@example.com
      MAIL_FROM_NAME: OsunBiz
    # Health check
    healthCheck:
      httpPath: /health